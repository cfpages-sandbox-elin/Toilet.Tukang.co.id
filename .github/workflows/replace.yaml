name: Repository Text and Contact Route Update v1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Transformation mode
        required: true
        type: choice
        options:
          - contact-routes
          - exact
          - metadata-cards
      spec_json:
        description: Strict JSON specification for the selected mode
        required: true
        type: string
      expected_base_sha:
        description: Exact branch SHA that was reviewed before dispatch
        required: true
        type: string
      commit_message:
        description: Commit message for an actual verified change
        required: false
        default: Apply reviewed repository transformation
        type: string

permissions:
  contents: read

concurrency:
  group: repository-transform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify dispatch binding
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "The workflow must be dispatched against a branch." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_base_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "The dispatched branch moved after review; refusing to transform stale bytes." >&2
            exit 1
          fi

      - name: Check out the reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run transformer regression tests
        run: python .github/scripts/test_repository_transform.py

      - name: Transform reviewed files
        id: transform
        env:
          TRANSFORM_MODE: ${{ inputs.mode }}
          TRANSFORM_SPEC_JSON: ${{ inputs.spec_json }}
          TRANSFORM_PATHS_FILE: ${{ runner.temp }}/repository-transform-paths.nul
          TRANSFORM_SUMMARY_FILE: ${{ runner.temp }}/repository-transform-summary.json
          TRANSFORM_INVENTORY_JSON: ${{ runner.temp }}/repository-transform-inventory.json
          TRANSFORM_INVENTORY_MD: ${{ runner.temp }}/repository-transform-inventory.md
        run: |
          python .github/scripts/repository_transform.py transform \
            --root "$GITHUB_WORKSPACE" \
            --mode "$TRANSFORM_MODE" \
            --spec-json "$TRANSFORM_SPEC_JSON" \
            --paths-file "$TRANSFORM_PATHS_FILE" \
            --summary-file "$TRANSFORM_SUMMARY_FILE" \
            --inventory-json "$TRANSFORM_INVENTORY_JSON" \
            --inventory-markdown "$TRANSFORM_INVENTORY_MD" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload destination metadata inventory
        if: inputs.mode == 'metadata-cards' && steps.transform.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-transform-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-transform-summary.json
            ${{ runner.temp }}/repository-transform-inventory.json
            ${{ runner.temp }}/repository-transform-inventory.md
          if-no-files-found: error
          retention-days: 30

      - name: Verify exact unstaged boundary
        if: steps.transform.outputs.changed == 'true'
        env:
          TRANSFORM_PATHS_FILE: ${{ runner.temp }}/repository-transform-paths.nul
        run: |
          python .github/scripts/repository_transform.py verify-git \
            --root "$GITHUB_WORKSPACE" \
            --paths-file "$TRANSFORM_PATHS_FILE" \
            --state unstaged

      - name: Stage only verified paths
        if: steps.transform.outputs.changed == 'true'
        env:
          TRANSFORM_MODE: ${{ inputs.mode }}
          TRANSFORM_PATHS_FILE: ${{ runner.temp }}/repository-transform-paths.nul
        run: |
          git add --pathspec-from-file="$TRANSFORM_PATHS_FILE" --pathspec-file-nul
          if [[ "$TRANSFORM_MODE" == "contact-routes" ]]; then
            git diff --cached --check
          fi

      - name: Verify exact staged boundary
        if: steps.transform.outputs.changed == 'true'
        env:
          TRANSFORM_PATHS_FILE: ${{ runner.temp }}/repository-transform-paths.nul
        run: |
          python .github/scripts/repository_transform.py verify-git \
            --root "$GITHUB_WORKSPACE" \
            --paths-file "$TRANSFORM_PATHS_FILE" \
            --state staged

      - name: Commit and push verified changes
        if: steps.transform.outputs.changed == 'true'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report idempotent no-op
        if: steps.transform.outputs.changed != 'true'
        run: echo "The reviewed postconditions already hold; no commit or push was created."
